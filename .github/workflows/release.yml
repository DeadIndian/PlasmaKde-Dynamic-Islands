name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Extract version
        run: python3 -c "import json; print('VERSION=' + json.load(open('package/metadata.json'))['Version'])" >> $GITHUB_ENV

      - name: Build .plasmoid
        run: |
          apt-get update && apt-get install -y zip
          cd package && zip -r -q "../dynamicisland-${{ env.VERSION }}.plasmoid" . -x '.*' -x '*/.*'

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dynamicisland-${{ env.VERSION }}.plasmoid
          tag_name: ${{ github.ref_name }}
          name: Dynamic Islands ${{ env.VERSION }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
